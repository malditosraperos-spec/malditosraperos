name: Verificar Enlaces de Radio Diariamente

on:
  schedule:
    # Se ejecutará automáticamente todos los días a las 09:00 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite lanzarlo manualmente desde la pestaña "Actions" de GitHub cuando quieras

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias de Firebase Admin
        run: npm install firebase-admin

      - name: Ejecutar script de verificación
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node verificar-enlaces.js